# Product Comparison POC — full stack (backend + frontend)
#
#   docker compose up --build -d     # start both
#   docker compose logs -f           # follow logs
#   docker compose down              # stop both
#
# Frontend:  http://localhost:5173
# Backend:   http://localhost:8000  (docs at /docs)

services:
  backend:
    build: ./backend
    container_name: product-comparison-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app # bind mount for hot reload
    restart: unless-stopped

  frontend:
    build: ./app-price-whiz
    container_name: product-comparison-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # Vite dev-server proxies /api to the backend container (compose DNS name)
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./app-price-whiz:/app # bind mount for hot reload
      - whiz_node_modules:/app/node_modules # keep container-installed deps (native binaries)
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  whiz_node_modules:
